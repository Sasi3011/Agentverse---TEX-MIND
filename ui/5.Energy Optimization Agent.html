<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent 5: Energy & Utility Optimization | TEXMIND</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #050505;
      --surface: #121212;
      --surface-border: #2a2a2a;
      --accent-primary: #3b82f6; /* Blue for energy */
      --accent-secondary: #0ea5e9; /* Light blue */
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-yellow: #f59e0b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'Inter', sans-serif;
      --font-display: 'Bebas Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-top: 0px;
}

    /* Navigation */
    nav {
      border-bottom: 1px solid var(--surface-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5,5,5,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 2rem;
      text-decoration: none;
      color: var(--text);
      letter-spacing: 2px;
    }
    .nav-logo span { color: var(--accent-primary); }
    
    .nav-links {
      display: flex;
      gap: 1.5rem;
    }
    .nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--text); }

    /* Dashboard Layout */
    .dashboard-container {
      flex: 1;
      padding: 2rem;
      display: grid;
      grid-template-columns: 350px 1fr;
      gap: 2rem;
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 1024px) {
      .dashboard-container {
        grid-template-columns: 1fr;
      }
    }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--surface-border);
      padding-bottom: 1rem;
      margin-bottom: 0.5rem;
    }
    .panel-title {
      font-family: var(--font-display);
      font-size: 1.5rem;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .panel-title i { color: var(--accent-primary); }

    /* Metrics */
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }
    .metric-card {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--surface-border);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .metric-value {
      font-family: var(--font-mono);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-primary);
      margin: 0.5rem 0;
    }
    .metric-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .metric-card.alert {
      border-color: var(--accent-red);
      background: rgba(239, 68, 68, 0.05);
    }
    .metric-card.alert .metric-value {
      color: var(--accent-red);
    }

    /* Feed */
    .feed-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      max-height: 400px;
    }
    .feed-item {
      padding: 1rem;
      border-radius: 8px;
      border-left: 4px solid var(--accent-green);
      background: rgba(255,255,255,0.02);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .feed-item.anomaly {
      border-left-color: var(--accent-red);
      background: rgba(239, 68, 68, 0.05);
    }
    .feed-item-main {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }
    .feed-item-title {
      font-weight: 600;
      font-family: var(--font-mono);
      font-size: 0.9rem;
    }
    .feed-item-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .feed-item-cost {
      font-family: var(--font-mono);
      font-weight: bold;
      color: var(--accent-red);
      font-size: 0.9rem;
    }
    .feed-item-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    /* Main Chart Area */
    .chart-container {
      position: relative;
      height: 400px;
      width: 100%;
    }

    /* AI Insight Box */
    .insight-box {
      background: linear-gradient(145deg, rgba(59, 130, 246, 0.1), rgba(14, 165, 233, 0.05));
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 8px;
      padding: 1.5rem;
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }
    .insight-icon {
      font-size: 1.5rem;
      color: var(--accent-primary);
    }
    .insight-content h4 {
      margin-bottom: 0.5rem;
      font-family: var(--font-display);
      letter-spacing: 1px;
      font-size: 1.2rem;
    }
    .insight-content p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }

  
    /* NAV (Added dynamically) */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: #0f172a;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .nav-logo span {
      color: #f97316;
    }

    .nav-links {
      display: flex;
      list-style: none;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .nav-links li {
      display: flex;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #475569;
      padding: 0 0.8rem;
      height: 60px;
      display: flex;
      align-items: center;
      border-left: 1px solid #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-links a:hover, .nav-links a.active {
      background: #f97316;
      color: #0f172a;
    }

  
    .btn, .btn-primary {
      color: #ffffff !important;
    }
    .btn:hover, .btn-primary:hover {
      color: #ffffff !important;
    }

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

  <script src="agent-embed.js"></script>
</head>
<body>
  

  <div class="dashboard-container">
    <!-- Left Sidebar: Overview & Feed -->
    <div class="panel">
      <div class="panel-header">
        <h2 class="panel-title"><i class="fa-solid fa-bolt"></i> Real-Time Monitor</h2>
      </div>
      
      <div class="metric-grid">
        <div class="metric-card">
          <div class="metric-label">Current Load (kW)</div>
          <div class="metric-value" id="current-load">295.0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Baseline (kW)</div>
          <div class="metric-value" style="color: var(--text-muted);" id="baseline-load">295.0</div>
        </div>
        <div class="metric-card alert">
          <div class="metric-label">Est. Waste Cost (INR)</div>
          <div class="metric-value" id="waste-cost">₹0</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Active Anomalies</div>
          <div class="metric-value" style="color: var(--accent-red);" id="active-anomalies">0</div>
        </div>
      </div>

      <div class="panel-header" style="margin-top: 1rem;">
        <h2 class="panel-title" style="font-size: 1.2rem;"><i class="fa-solid fa-list-ul"></i> Anomaly Feed</h2>
      </div>
      <div class="feed-list" id="anomaly-feed">
        <!-- JS will populate this -->
      </div>
    </div>

    <!-- Right Content: Chart & AI Insights -->
    <div style="display: flex; flex-direction: column; gap: 2rem;">
      <div class="panel" style="flex: 1;">
        <div class="panel-header">
          <h2 class="panel-title"><i class="fa-solid fa-chart-area"></i> Live Consumption Trends (Isolation Forest)</h2>
          <select id="machine-selector" style="background: var(--bg); color: var(--text); border: 1px solid var(--surface-border); padding: 0.5rem; font-family: var(--font-mono); border-radius: 4px;">
            <option value="ALL">All Machines</option>
            <option value="BOILER-01">BOILER-01</option>
            <option value="COMPRESSOR-01">COMPRESSOR-01</option>
            <option value="MOTOR-01">MOTOR-01</option>
          </select>
        </div>
        <div class="chart-container">
          <canvas id="energyChart"></canvas>
        </div>
      </div>

      <div class="insight-box">
        <i class="fa-solid fa-robot insight-icon"></i>
        <div class="insight-content">
          <h4>Agent 5 Recommendation Engine</h4>
          <p id="ai-insight">Monitoring baseline consumption. Models are actively learning load patterns.</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Initialize Chart
    const ctx = document.getElementById('energyChart').getContext('2d');
    
    // Set global Chart.js styles
    Chart.defaults.color = '#475569';
    Chart.defaults.borderColor = 'rgba(15, 23, 42, 0.08)';
    Chart.defaults.font.family = "'Space Mono', monospace";
    
    const energyChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], // Timestamps
        datasets: [
          {
            label: 'Actual Consumption (kWh)',
            data: [],
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            borderWidth: 2,
            tension: 0.4,
            fill: true,
            pointRadius: 0
          },
          {
            label: 'Dynamic Baseline (kWh)',
            data: [],
            borderColor: '#94a3b8',
            borderWidth: 1,
            borderDash: [5, 5],
            tension: 0.4,
            pointRadius: 0
          },
          {
            label: 'Anomalies',
            data: [],
            backgroundColor: '#ef4444',
            borderColor: '#ef4444',
            borderWidth: 2,
            pointRadius: 6,
            pointStyle: 'crossRot',
            showLine: false
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        plugins: {
          legend: { position: 'top' },
          tooltip: {
            mode: 'index',
            intersect: false,
            backgroundColor: 'rgba(18, 18, 18, 0.9)',
            titleColor: '#f8fafc',
            bodyColor: '#f8fafc',
            borderColor: '#2a2a2a',
            borderWidth: 1
          }
        },
        scales: {
          x: { grid: { color: '#2a2a2a' } },
          y: { 
            grid: { color: '#2a2a2a' },
            beginAtZero: false
          }
        }
      }
    });
    const API_BASE = "http://localhost:8005/agents/energy";

    // Simulation Data & Logic
    let timeIndex = 0;
    const machines = ['BOILER-01', 'COMPRESSOR-01', 'MOTOR-01'];
    const machineData = {
      'BOILER-01': { base: 120, noise: 5, current: 120, baseline: 120 },
      'COMPRESSOR-01': { base: 45, noise: 2, current: 45, baseline: 45 },
      'MOTOR-01': { base: 80, noise: 3, current: 80, baseline: 80 }
    };
    
    let chartDataBuffer = [];
    let anomalyCount = 0;
    let totalWasteCost = 0;

    function formatTime(date) {
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function addFeedItem(machineId, consumption, baseline, cost, hint) {
      const feed = document.getElementById('anomaly-feed');
      const item = document.createElement('div');
      item.className = 'feed-item anomaly';
      
      const now = formatTime(new Date());
      
      item.innerHTML = `
        <div class="feed-item-main">
          <div class="feed-item-title">${machineId} - Anomaly Detected</div>
          <div class="feed-item-desc">${consumption.toFixed(1)} kWh (Baseline: ${baseline.toFixed(1)} kWh)</div>
          <div class="feed-item-desc" style="color:#0f172a; margin-top:4px;">Action: ${hint}</div>
        </div>
        <div style="text-align:right;">
          <div class="feed-item-cost">+₹${cost.toLocaleString()}</div>
          <div class="feed-item-time">${now}</div>
        </div>
      `;
      
      feed.prepend(item);
      if (feed.children.length > 20) {
        feed.removeChild(feed.lastChild);
      }
    }

    // Ingest data into backend and render
    async function tickIngest() {
      timeIndex++;
      const now = new Date();
      const timeStr = formatTime(now);
      
      let totalCurrent = 0;
      let totalBaseline = 0;
      const selectedMachine = document.getElementById('machine-selector').value;

      for (const m of machines) {
        let consumption = machineData[m].base + (Math.random() * machineData[m].noise * 2 - machineData[m].noise);
        // Randomly inject anomaly
        let forceAnomaly = Math.random() < 0.05;
        if (forceAnomaly) {
          consumption *= (1.3 + Math.random() * 0.5); // 30-80% spike
        }

        try {
          const res = await fetch(`${API_BASE}/ingest`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              machine_id: m,
              timestamp: now.toISOString(),
              power_kwh: parseFloat(consumption.toFixed(2))
            })
          });
          if (res.ok) {
            const report = await res.json();
            machineData[m].current = consumption;
            machineData[m].baseline = report.baseline_kwh;
            
            if (report.status === 'anomaly') {
              anomalyCount++;
              totalWasteCost += report.estimated_monthly_excess_cost_inr;
              addFeedItem(m, consumption, report.baseline_kwh, report.estimated_monthly_excess_cost_inr, report.likely_cause_hint);
              document.getElementById('ai-insight').innerHTML = `<strong style="color:var(--accent-red)">Agent Alert:</strong> Anomaly on ${m}. Cost impact: ₹${report.estimated_monthly_excess_cost_inr.toLocaleString()}/mo. Hint: ${report.likely_cause_hint}`;
            }
          }
        } catch (e) {
          // Offline fallback
          machineData[m].current = consumption;
          if (forceAnomaly) {
            anomalyCount++;
            const excessCost = Math.round((consumption - machineData[m].baseline) * 24 * 30 * 7.5);
            totalWasteCost += excessCost;
            addFeedItem(m, consumption, machineData[m].baseline, excessCost, "Verify backend is running on port 8005");
          }
        }

        totalCurrent += machineData[m].current;
        totalBaseline += machineData[m].baseline;
      }

      // Update Metrics
      document.getElementById('current-load').textContent = totalCurrent.toFixed(1);
      document.getElementById('baseline-load').textContent = totalBaseline.toFixed(1);
      document.getElementById('active-anomalies').textContent = anomalyCount;
      document.getElementById('waste-cost').textContent = `₹${totalWasteCost.toLocaleString()}`;

      // Update Chart Data
      energyChart.data.labels.push(timeStr);
      energyChart.data.datasets[0].data.push(selectedMachine === 'ALL' ? totalCurrent : machineData[selectedMachine === 'ALL' ? 'BOILER-01' : selectedMachine].current);
      energyChart.data.datasets[1].data.push(selectedMachine === 'ALL' ? totalBaseline : machineData[selectedMachine === 'ALL' ? 'BOILER-01' : selectedMachine].baseline);
      energyChart.data.datasets[2].data.push(null); // Simple default placeholder for anomaly dots
      
      if (energyChart.data.labels.length > 30) {
        energyChart.data.labels.shift();
        energyChart.data.datasets[0].data.shift();
        energyChart.data.datasets[1].data.shift();
        energyChart.data.datasets[2].data.shift();
      }
      energyChart.update();
    }

    setInterval(tickIngest, 3000);
  </script>

  <!-- Iframe view compatibility script -->
  <script>
    if (window.self !== window.top) {
      const navEl = document.querySelector('nav');
      if (navEl) {
        navEl.style.display = 'none';
      }
      document.body.style.paddingTop = '0px';
    }
  </script>


  <!-- ChartJS Color Correction Script -->
  <script>
    if (window.Chart) {
      Chart.defaults.color = '#475569';
      Chart.defaults.borderColor = 'rgba(15, 23, 42, 0.08)';
    }
  </script>

</body>
