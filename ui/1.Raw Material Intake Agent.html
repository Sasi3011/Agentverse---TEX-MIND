<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEXMIND — Raw Material Intake Agent Live Operations</title>
  <meta name="description" content="Live monitoring and real-time inference interface for Agent 01: Raw Material Intake Agent in TexMind Industry 4.0 Suite.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --accent: #f59e0b;
      --white: #0f172a;
      --dark: #f8fafc;
      --dark-card: #ffffff;
      --border: 2px solid #e2e8f0;
      --green: #22c55e;
      --red: #ef4444;
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      padding-top: 0px;
}

    body {
      background-color: var(--dark);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      flex-direction: column;
    }

    /* NOISE OVERLAY */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.04; mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
    }

    header {
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      padding: 0 2rem;
      height: 54px;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-decoration: none;
      color: var(--white);
    }

    .brand span {
      color: var(--accent);
    }

    .agent-tag {
      background: var(--accent);
      color: var(--white);
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.3rem 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      background: rgba(34, 197, 94, 0.1);
      color: var(--green);
      padding: 0.4rem 0.8rem;
      border: 1px solid var(--green);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .container {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      padding: 1rem 2rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    @media (max-width: 1024px) {
      html, body {
        height: auto;
        max-height: none;
        overflow: auto;
      }
      .container {
        grid-template-columns: 1fr;
        overflow: visible;
      }
    }

    .panel {
      background: var(--dark-card);
      border: var(--border);
      box-shadow: 6px 6px 0 #000;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 0;
      overflow-y: auto;
    }

    .panel-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 2px solid #cbd5e1;
      padding-bottom: 0.75rem;
      color: var(--white);
    }

    .panel-title i {
      color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.75rem;
      color: #64748b;
      font-family: 'Space Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      color: var(--white);
      padding: 0.85rem 1rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn {
      background: var(--accent);
      color: var(--white);
      border: 3px solid var(--accent);
      padding: 1rem 1.5rem;
      font-weight: 700;
      font-family: 'Space Mono', monospace;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.05);
      transition: all 0.15s;
    }

    .btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 rgba(0, 0, 0, 0.1);
    }

    .preset-btns {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .preset-btn {
      padding: 0.4rem 0.8rem;
      font-size: 0.7rem;
      font-family: 'Space Mono', monospace;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #333;
      cursor: pointer;
      text-transform: uppercase;
    }

    .preset-btn:hover {
      background: var(--accent);
      color: var(--white);
      border-color: var(--accent);
    }

    /* RESULT CARDS */
    .result-box {
      background: #ffffff;
      border: 2px solid #cbd5e1;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .decision-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      letter-spacing: 0.05em;
    }

    .decision-pass {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border: 2px solid var(--green);
    }

    .decision-flag {
      background: rgba(239, 68, 68, 0.15);
      color: var(--red);
      border: 2px solid var(--red);
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .metric-card {
      background: var(--dark-card);
      border: 2px solid #cbd5e1;
      padding: 1.25rem;
      text-align: center;
    }

    .metric-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2.8rem;
      line-height: 1;
      margin-top: 0.3rem;
    }

    .flags-list {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .flag-item {
      background: rgba(239, 68, 68, 0.1);
      border-left: 4px solid var(--red);
      color: #fca5a5;
      padding: 0.75rem 1rem;
      font-size: 0.8rem;
      font-family: 'Space Mono', monospace;
    }

    footer {
      background: #ffffff;
      border-top: 2px solid #e2e8f0;
      padding: 1.5rem 2rem;
      text-align: center;
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: auto;
    }
  
    /* NAV (Added dynamically) */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2rem;
      height: 60px;
    }

    .nav-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.8rem;
      color: #0f172a;
      letter-spacing: 0.05em;
      text-decoration: none;
    }

    .nav-logo span {
      color: #f59e0b;
    }

    .nav-links {
      display: flex;
      list-style: none;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    .nav-links li {
      display: flex;
    }

    .nav-links a {
      font-family: 'Space Mono', monospace;
      font-size: 0.7rem;
      color: #475569;
      padding: 0 0.8rem;
      height: 60px;
      display: flex;
      align-items: center;
      border-left: 1px solid #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      transition: all 0.2s;
      text-decoration: none;
    }

    .nav-links a:hover, .nav-links a.active {
      background: #f59e0b;
      color: #0f172a;
    }

  
    .btn, .btn-primary {
      color: #ffffff !important;
    }
    .btn:hover, .btn-primary:hover {
      color: #ffffff !important;
    }

  </style>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="agent-shared.css">
  <script src="agent-embed.js"></script>
</head>
<body class="agent-fixed-viewport">

  

  <div class="container">
    <!-- Left Panel -->
    <div class="panel">
      <div class="panel-title">
        <i class="fas fa-sliders"></i> Intake Batch Controls
      </div>

      <div class="preset-btns">
        <span style="font-size:0.7rem; color:rgb(0, 0, 0); align-self:center; font-family:'Space Mono';">PRESETS:</span>
        <button class="preset-btn" onclick="applyPreset('pass')">Valid Premium Batch</button>
        <button class="preset-btn" onclick="applyPreset('moisture_fail')">High Moisture Defect</button>
        <button class="preset-btn" onclick="applyPreset('supplier_flag')">Risky Supplier</button>
      </div>

      <form id="intakeForm" onsubmit="evaluateMaterial(event)">
        <div class="grid-2">
          <div class="form-group">
            <label for="batch_id">BATCH ID</label>
            <input type="text" id="batch_id" value="B-2026-8801" required>
          </div>
          <div class="form-group">
            <label for="supplier_id">SUPPLIER ID</label>
            <select id="supplier_id" required>
              <option value="SUP-01">SUP-01 (Apex Yarns)</option>
              <option value="SUP-02">SUP-02 (Vortex Fibers)</option>
              <option value="SUP-03">SUP-03 (SilkLine Mills)</option>
              <option value="SUP-04">SUP-04 (Global Threads)</option>
              <option value="SUP-05">SUP-05 (EcoTextiles)</option>
            </select>
          </div>
        </div>

        <div class="grid-2" style="margin-top: 1rem;">
          <div class="form-group">
            <label for="moisture_pct">MOISTURE CONTENT (%)</label>
            <input type="number" step="0.1" id="moisture_pct" value="7.2" min="0" max="20" required>
            <span style="font-size: 0.65rem; color: rgba(255,255,255,0.4); font-family: 'Space Mono';">Max Threshold: 8.5%</span>
          </div>
          <div class="form-group">
            <label for="tensile_strength_g_tex">TENSILE STRENGTH (g/tex)</label>
            <input type="number" step="0.1" id="tensile_strength_g_tex" value="19.8" min="0" required>
            <span style="font-size: 0.65rem; color: rgba(255,255,255,0.4); font-family: 'Space Mono';">Min Threshold: 18.0 g/tex</span>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label for="fiber_count">FIBER / YARN COUNT (Ne)</label>
          <input type="number" id="fiber_count" value="30" min="1" required>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn" style="flex: 1;" id="evaluateBtn">
            <i class="fas fa-microchip"></i> Run Agent 01 Inference
          </button>
        </div>
      </form>
    </div>

    <!-- Right Panel -->
    <div class="panel">
      <div class="panel-title">
        <i class="fas fa-chart-pie"></i> Real-Time Evaluation Outcome
      </div>

      <div id="resultsContainer">
        <div class="result-box" style="text-align: center; padding: 4rem 1rem; color: rgba(255,255,255,0.4);">
          <i class="fas fa-arrow-left" style="font-size: 2rem; margin-bottom: 1rem; color: var(--accent);"></i>
          <p style="font-family: 'Space Mono'; font-size: 0.85rem;">Submit a yarn batch on the left to trigger Agent 01 gradient boosting inference & rule gates.</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    TEXMIND Multi-Agent Cognitive Twin • Raw Material Intake Agent Subsystem (Port 8001)
  </footer>

  <script>
    const API_BASE = "http://localhost:8001/agents/intake";

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        const badge = document.getElementById("agentHealth");
        if (data.status === "ok") {
          badge.innerHTML = `<div class="status-dot"></div><span>AGENT ONLINE (v${data.model_version})</span>`;
          badge.style.color = "var(--green)";
        }
      } catch (err) {
        const badge = document.getElementById("agentHealth");
        badge.innerHTML = `<div class="status-dot" style="background:var(--red); box-shadow:0 0 8px var(--red);"></div><span style="color:var(--red);">AGENT OFFLINE</span>`;
      }
    }

    function applyPreset(type) {
      if (type === 'pass') {
        document.getElementById('batch_id').value = 'B-2026-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('supplier_id').value = 'SUP-01';
        document.getElementById('moisture_pct').value = 7.4;
        document.getElementById('tensile_strength_g_tex').value = 20.5;
        document.getElementById('fiber_count').value = 30;
      } else if (type === 'moisture_fail') {
        document.getElementById('batch_id').value = 'B-2026-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('supplier_id').value = 'SUP-02';
        document.getElementById('moisture_pct').value = 9.8;
        document.getElementById('tensile_strength_g_tex').value = 17.2;
        document.getElementById('fiber_count').value = 24;
      } else if (type === 'supplier_flag') {
        document.getElementById('batch_id').value = 'B-2026-' + Math.floor(1000 + Math.random() * 9000);
        document.getElementById('supplier_id').value = 'SUP-04';
        document.getElementById('moisture_pct').value = 8.1;
        document.getElementById('tensile_strength_g_tex').value = 18.2;
        document.getElementById('fiber_count').value = 40;
      }
    }

    async function evaluateMaterial(e) {
      e.preventDefault();
      const btn = document.getElementById('evaluateBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Running Inference...`;

      const payload = {
        batch_id: document.getElementById('batch_id').value,
        supplier_id: document.getElementById('supplier_id').value,
        moisture_pct: parseFloat(document.getElementById('moisture_pct').value),
        tensile_strength_g_tex: parseFloat(document.getElementById('tensile_strength_g_tex').value),
        fiber_count: parseInt(document.getElementById('fiber_count').value, 10)
      };

      try {
        const res = await fetch(`${API_BASE}/evaluate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        alert("Failed to connect to Intake Agent backend service at " + API_BASE);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-microchip"></i> Run Agent 01 Inference`;
      }
    }

    function renderResults(data) {
      const container = document.getElementById('resultsContainer');
      const isPass = data.decision === 'pass';
      
      let flagsHtml = '';
      if (data.flags && data.flags.length > 0) {
        flagsHtml = `
          <div style="margin-top: 0.5rem;">
            <label style="margin-bottom:0.4rem; display:block;">QUALITY WARNINGS & FLAGS</label>
            <div class="flags-list">
              ${data.flags.map(f => `<div class="flag-item"><i class="fas fa-exclamation-triangle"></i> ${f}</div>`).join('')}
            </div>
          </div>
        `;
      } else {
        flagsHtml = `
          <div style="margin-top: 0.5rem;">
            <label style="margin-bottom:0.4rem; display:block;">QUALITY WARNINGS & FLAGS</label>
            <div style="color: var(--green); font-family: 'Space Mono'; font-size: 0.85rem;">
              <i class="fas fa-check-circle"></i> Zero quality flags detected. All rule gates passed.
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        <div class="result-box">
          <div class="decision-banner ${isPass ? 'decision-pass' : 'decision-flag'}">
            <span>DECISION: ${data.decision.toUpperCase()}</span>
            <i class="fas ${isPass ? 'fa-circle-check' : 'fa-triangle-exclamation'}"></i>
          </div>

          <div class="metrics-grid">
            <div class="metric-card">
              <label>QUALITY SCORE</label>
              <div class="metric-val" style="color:${data.quality_score > 70 ? 'var(--green)' : 'var(--red)'}">
                ${data.quality_score}
              </div>
            </div>
            <div class="metric-card">
              <label>CONFIDENCE</label>
              <div class="metric-val" style="color:var(--white)">
                ${(data.confidence * 100).toFixed(0)}%
              </div>
            </div>
          </div>

          ${flagsHtml}
        </div>
      `;
    }

    checkHealth();
    setInterval(checkHealth, 10000);
  </script>

  <!-- Iframe view compatibility script -->
  <script>
    if (window.self !== window.top) {
      const navEl = document.querySelector('nav');
      if (navEl) {
        navEl.style.display = 'none';
      }
      document.body.style.paddingTop = '0px';
    }
  </script>


  <!-- ChartJS Color Correction Script -->
  <script>
    if (window.Chart) {
      Chart.defaults.color = '#475569';
      Chart.defaults.borderColor = 'rgba(15, 23, 42, 0.08)';
    }
  </script>

</body>
</html>
