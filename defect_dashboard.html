<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TexMind — Weaving Defect Detection Agent Live Operations</title>
  <meta name="description" content="Live monitoring and real-time inference interface for Agent 02: Weaving Defect Detection Agent.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@400;500;700&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: #12161f;
      --panel-border: #1e2638;
      --accent: #3b82f6; /* Blue for agent 2 to differentiate from agent 1's orange */
      --accent-glow: rgba(59, 130, 246, 0.25);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.2);
      --red: #ef4444;
      --red-glow: rgba(239, 68, 68, 0.2);
      --yellow: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --font-mono: 'Space Mono', monospace;
      --font-sans: 'DM Sans', sans-serif;
      --font-heading: 'Bebas Neue', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-family: var(--font-heading);
      font-size: 1.8rem;
      letter-spacing: 1px;
      text-decoration: none;
      color: #fff;
    }

    .brand i { color: var(--accent); }

    .agent-tag {
      background: var(--panel-border);
      color: var(--accent);
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 0.35rem 0.75rem;
      border-radius: 4px;
      border: 1px solid var(--accent-glow);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      background: rgba(16, 185, 129, 0.1);
      color: var(--green);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      border: 1px solid var(--green-glow);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      flex-grow: 1;
    }

    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .panel-title {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.75rem;
    }

    .panel-title i { color: var(--accent); }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    label {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }

    input, select, .file-drop {
      background: #0d1017;
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 0.75rem 1rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-glow);
    }
    
    .file-drop {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border: 2px dashed var(--panel-border);
      cursor: pointer;
      text-align: center;
    }
    .file-drop:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.85rem 1.5rem;
      border-radius: 6px;
      font-weight: 700;
      font-family: var(--font-sans);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.2s;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    .btn:hover { background: #2563eb; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* Result styles */
    .result-box {
      background: #0d1017;
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .decision-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.2rem;
    }

    .decision-continue { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid var(--green); }
    .decision-flag { background: rgba(245, 158, 11, 0.15); color: var(--yellow); border: 1px solid var(--yellow); }
    .decision-reject { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid var(--red); }

    .image-preview-container {
      position: relative;
      width: 100%;
      height: 300px;
      background: #000;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .image-preview-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .bbox {
      position: absolute;
      border: 2px solid var(--red);
      background: rgba(239, 68, 68, 0.2);
    }
    
    .bbox-label {
      position: absolute;
      top: -20px;
      left: -2px;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-family: var(--font-mono);
      padding: 2px 4px;
      white-space: nowrap;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .metric-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      padding: 1rem;
      border-radius: 6px;
      text-align: center;
    }

    .metric-val {
      font-family: var(--font-mono);
      font-size: 1.8rem;
      font-weight: 700;
      margin-top: 0.25rem;
    }

    footer {
      background: var(--panel-bg);
      border-top: 1px solid var(--panel-border);
      padding: 1rem 2rem;
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="brand">
      <i class="fas fa-eye"></i> TEXMIND
    </a>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <span class="agent-tag">AGENT 02: WEAVING DEFECT VISION</span>
      <div class="status-badge" id="agentHealth">
        <div class="status-dot"></div>
        <span>AGENT ONLINE (v0.3)</span>
      </div>
    </div>
  </header>

  <div class="container">
    <!-- Left Column: Input -->
    <div class="panel">
      <div class="panel-title">
        <i class="fas fa-camera"></i> Live Loom Camera Feed
      </div>

      <form id="inspectionForm" onsubmit="inspectFabric(event)">
        <div class="grid-2">
          <div class="form-group">
            <label for="batch_id">BATCH ID</label>
            <input type="text" id="batch_id" value="B-2026-0001" required>
          </div>
          <div class="form-group">
            <label for="roll_position_m">ROLL POSITION (m)</label>
            <input type="number" step="0.1" id="roll_position_m" value="42.5" required>
          </div>
        </div>

        <div class="form-group" style="margin-top: 1rem;">
          <label>FABRIC IMAGE FRAME</label>
          <label class="file-drop" for="image_upload">
            <i class="fas fa-upload" style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--accent);"></i>
            <span>Click to upload frame or drag & drop</span>
            <input type="file" id="image_upload" accept="image/jpeg, image/png" style="display:none" onchange="previewImage(event)" required>
          </label>
          <div id="uploadPreviewName" style="font-size: 0.8rem; margin-top: 0.5rem; color: var(--accent); font-family: var(--font-mono);"></div>
        </div>

        <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
          <button type="submit" class="btn" style="flex: 1;" id="inspectBtn">
            <i class="fas fa-magnifying-glass"></i> Run AI Inspection
          </button>
        </div>
      </form>
    </div>

    <!-- Right Column: Decision -->
    <div class="panel">
      <div class="panel-title">
        <i class="fas fa-crosshairs"></i> Defect Analysis & YOLOv8 Output
      </div>

      <div id="resultsContainer">
        <div class="result-box" style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
          <i class="fas fa-arrow-left" style="font-size: 2rem; margin-bottom: 1rem; color: var(--panel-border);"></i>
          <p>Upload a fabric frame to trigger Agent 02 object detection.</p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    TexMind Multi-Agent Cognitive Twin Framework • Weaving Defect Detection Agent (Port 8002)
  </footer>

  <script>
    const API_BASE = "http://localhost:8002/agents/defect";
    let currentImageFile = null;
    let currentImageURL = null;
    let currentImageWidth = 0;
    let currentImageHeight = 0;

    async function checkHealth() {
      try {
        const res = await fetch(`${API_BASE}/health`);
        const data = await res.json();
        const badge = document.getElementById("agentHealth");
        if (data.status === "ok") {
          badge.innerHTML = `<div class="status-dot"></div><span>AGENT ONLINE (v${data.model_version})</span>`;
          badge.style.color = "var(--green)";
        }
      } catch (err) {
        const badge = document.getElementById("agentHealth");
        badge.innerHTML = `<div class="status-dot" style="background:var(--red); box-shadow:0 0 8px var(--red);"></div><span style="color:var(--red);">AGENT OFFLINE</span>`;
      }
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        currentImageFile = file;
        document.getElementById('uploadPreviewName').innerText = `Selected: ${file.name}`;
        currentImageURL = URL.createObjectURL(file);
        
        // Get image dimensions for drawing bounding boxes correctly later
        const img = new Image();
        img.onload = function() {
            currentImageWidth = this.width;
            currentImageHeight = this.height;
        };
        img.src = currentImageURL;
      }
    }

    async function inspectFabric(e) {
      e.preventDefault();
      if (!currentImageFile) {
        alert("Please select an image first.");
        return;
      }

      const btn = document.getElementById('inspectBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Analyzing Frame...`;

      const formData = new FormData();
      formData.append('batch_id', document.getElementById('batch_id').value);
      formData.append('roll_position_m', document.getElementById('roll_position_m').value);
      formData.append('file', currentImageFile);

      try {
        const res = await fetch(`${API_BASE}/inspect`, {
          method: 'POST',
          body: formData
        });

        const data = await res.json();
        renderResults(data);
      } catch (err) {
        alert("Failed to connect to Defect Detection Agent backend service at " + API_BASE);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fas fa-magnifying-glass"></i> Run AI Inspection`;
      }
    }

    function renderResults(data) {
      const container = document.getElementById('resultsContainer');
      let decisionClass = 'decision-continue';
      let icon = 'fa-circle-check';
      
      if (data.decision === 'reject roll') {
        decisionClass = 'decision-reject';
        icon = 'fa-circle-xmark';
      } else if (data.decision === 'flag') {
        decisionClass = 'decision-flag';
        icon = 'fa-triangle-exclamation';
      }
      
      // Calculate scaled bounding boxes based on a typical 300px height container
      let bboxesHtml = '';
      if (data.defects && data.defects.length > 0 && currentImageWidth > 0) {
          // Assuming the img is rendered with object-fit: contain
          // We don't have perfect JS layout calculation here for demo, so we'll approximate percentages
          bboxesHtml = data.defects.map(d => {
              const [x1, y1, x2, y2] = d.bbox;
              const left = (x1 / currentImageWidth) * 100;
              const top = (y1 / currentImageHeight) * 100;
              const width = ((x2 - x1) / currentImageWidth) * 100;
              const height = ((y2 - y1) / currentImageHeight) * 100;
              
              return `
                <div class="bbox" style="left: ${left}%; top: ${top}%; width: ${width}%; height: ${height}%;">
                    <div class="bbox-label">${d.type} (${(d.confidence*100).toFixed(0)}%)</div>
                </div>
              `;
          }).join('');
      }

      container.innerHTML = `
        <div class="result-box">
          <div class="decision-banner ${decisionClass}">
            <span>ACTION: ${data.decision.toUpperCase()}</span>
            <i class="fas ${icon}"></i>
          </div>

          <div class="image-preview-container">
            <img src="${currentImageURL}" alt="Analyzed Fabric">
            ${bboxesHtml}
          </div>

          <div class="metrics-grid">
            <div class="metric-card">
              <label>DEFECTS FOUND</label>
              <div class="metric-val" style="color:${data.defects.length > 0 ? 'var(--red)' : 'var(--green)'}">
                ${data.defects.length}
              </div>
            </div>
            <div class="metric-card">
              <label>DEFECT DENSITY</label>
              <div class="metric-val" style="color:var(--text-main)">
                ${data.defect_density_per_10m} / 10m
              </div>
            </div>
          </div>
          
          <div style="margin-top:0.5rem;">
            <label style="display:block; margin-bottom:0.5rem;">DETECTED ISSUES</label>
            ${data.defects.length === 0 ? 
                `<div style="color:var(--green); font-family:var(--font-mono); font-size:0.85rem;"><i class="fas fa-check"></i> Fabric is clean. No defects detected.</div>` :
                `<div style="display:flex; flex-direction:column; gap:0.5rem;">
                    ${data.defects.map(d => `
                        <div style="background:rgba(239, 68, 68, 0.1); border-left:3px solid var(--red); padding:0.5rem; font-family:var(--font-mono); font-size:0.85rem;">
                            <strong>${d.type.toUpperCase()}</strong> - Confidence: ${(d.confidence*100).toFixed(1)}%
                        </div>
                    `).join('')}
                </div>`
            }
          </div>
        </div>
      `;
    }

    checkHealth();
    setInterval(checkHealth, 10000);
  </script>
</body>
</html>
